<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f4ef"><meta name="description" content="Complete your Gratitude Candle order."><link rel="icon" type="image/png" href="https://raw.githubusercontent.com/sjaiswal210-beep/gratitude-candles/main/DA54A8F6-5C69-408F-9A90-AF2CB15F319D.png"><link rel="apple-touch-icon" href="https://raw.githubusercontent.com/sjaiswal210-beep/gratitude-candles/main/DA54A8F6-5C69-408F-9A90-AF2CB15F319D.png"><title>Checkout | Gratitude Candle</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body class="checkout-page"><header><a class="brand" href="index.html"><img src="https://raw.githubusercontent.com/sjaiswal210-beep/gratitude-candles/main/DA54A8F6-5C69-408F-9A90-AF2CB15F319D.png" alt="Gratitude Candle logo"><span>Gratitude Candle<small>SECURE CHECKOUT</small></span></a><a class="back-shop" href="cart.html">← Cart</a></header><main class="shop-page checkout-main"><div class="simple-page-head"><h1 class="page-title">Delivery details</h1><p>Enter where we should deliver your order.</p></div><div class="checkout-layout"><form id="form" class="checkout-form"><h2>Contact & address</h2><div class="form-grid"><label class="full">Full name<input name="name" required maxlength="100" autocomplete="name" placeholder="Full name"></label><label class="full">Mobile number<input name="phone" required inputmode="numeric" pattern="[6-9][0-9]{9}" maxlength="10" autocomplete="tel" placeholder="10-digit mobile number"></label><label class="full">Delivery address<textarea name="address" required maxlength="500" autocomplete="street-address" placeholder="House / flat, street, area"></textarea></label><label>City<input name="city" required maxlength="80" autocomplete="address-level2" placeholder="City"></label><label>PIN code<input name="pin" required pattern="[0-9]{6}" maxlength="6" inputmode="numeric" autocomplete="postal-code" placeholder="6-digit PIN"></label></div><button id="submit" class="pay checkout-submit">Continue to payment →</button><p class="checkout-footnote">Payment is completed by UPI after your order is created.</p><div id="status" class="status hidden"></div><section id="payment" class="payment-panel hidden"><h2>Complete payment</h2><p id="ref" class="order-reference"></p><div class="qr"><img id="qr" alt="UPI payment QR code"></div><a id="upi" class="pay checkout-submit">Pay with UPI ↗</a><a id="wa" target="_blank" rel="noopener">Contact us about this order</a></section></form><aside class="checkout-summary"><h2>Order summary</h2><div id="lines"></div><div class="summary-total"><span>Total</span><b id="total">₹0</b></div><a class="edit-bag" href="cart.html">← Edit cart</a></aside></div></main><nav class="mobile-nav"><a href="index.html"><span>⌂</span>Home</a><a href="index.html#catalogue"><span>✧</span>Shop</a><a href="cart.html"><span>▢</span>Cart</a><a href="https://www.instagram.com/gratitudecandles51/" target="_blank" rel="noopener"><span>◎</span>Instagram</a></nav><script src="checkout.js"></script></body></html>
